name: Documentation problem
description: Report a confusing, missing, or incorrect documentation step.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the page or name the section or command.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was confusing or missing?
      description: Describe what you tried and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional wording, example, or expected next step.
