name: Feature request
description: Propose a focused evidence, policy, or integration improvement.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What uncertainty or repeated review work should this reduce?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this problem today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What should MergeReceipt observe or report?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Product layer
      description: Where does this belong, and why?
      options:
        - Deterministic core
        - Optional semantic/provider layer
        - Unsure
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Layer rationale
      description: Explain why the proposed behavior is reproducible evidence or secondary semantic judgment.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require a SaaS backend or mandatory AI provider.
          required: true
