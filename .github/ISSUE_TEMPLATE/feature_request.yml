name: Feature request
description: Propose a focused evidence, policy, or integration improvement.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What uncertainty or repeated review work should this reduce?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence
      description: What deterministic observation would the feature collect?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require a SaaS backend or mandatory AI provider.
          required: true
